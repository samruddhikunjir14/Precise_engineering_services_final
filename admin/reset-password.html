<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Admin Password | Precise Engineering Services</title>
<link rel="stylesheet" href="../portal.css">
</head>
<body>
<main class="portal">
<div class="brand"><span class="logo">PES</span><span><strong>PRECISE ENGINEERING</strong><small>SERVICES · PUNE, INDIA</small></span></div>
<div class="eyebrow">Administrator Portal</div><h1>Set a new password</h1>
<p class="muted">Choose a new password for your administrator account.</p>
<form id="reset-form">
<label for="password">New password</label><input id="password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required>
<label for="confirm-password">Confirm new password</label><input id="confirm-password" type="password" autocomplete="new-password" minlength="8" placeholder="Enter it again" required>
<button id="submit-button" type="submit" style="background:var(--navy);cursor:pointer">Update password</button>
<p id="message" class="muted" role="status" aria-live="polite">Opening your secure reset link…</p>
</form>
<div class="links"><a href="login.html">← Back to admin login</a><a href="../index.html">Company website</a></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../portal-config.js"></script>
<script>
(async function () {
 const message = document.getElementById('message');
 const form = document.getElementById('reset-form');
 const button = document.getElementById('submit-button');
 let client;
 try {
  client = window.supabase.createClient(window.PES_SUPABASE_URL, window.PES_SUPABASE_PUBLISHABLE_KEY);
  const { data, error } = await client.auth.getSession();
  if (error) throw error;
  if (!data.session) throw new Error('This reset link is invalid or expired. Return to admin login and request a new one.');
  message.textContent = 'Reset link verified. Enter your new password.';
 } catch (error) {
  message.textContent = error.message || 'Unable to verify this reset link.';
  button.disabled = true;
 }
 form.addEventListener('submit', async function (event) {
  event.preventDefault();
  const password = document.getElementById('password').value;
  const confirmation = document.getElementById('confirm-password').value;
  if (password.length < 8) { message.textContent = 'Use at least 8 characters.'; return; }
  if (password !== confirmation) { message.textContent = 'The passwords do not match.'; return; }
  button.disabled = true; message.textContent = 'Updating password…';
  try {
   const { error } = await client.auth.updateUser({ password });
   if (error) throw error;
   message.textContent = 'Password updated successfully. You can now sign in.';
   form.reset();
   setTimeout(function () { window.location.href = 'login.html'; }, 1800);
  } catch (error) {
   message.textContent = error.message || 'Could not update the password. Request a fresh reset link.';
   button.disabled = false;
  }
 });
})();
</script>
</body></html>
